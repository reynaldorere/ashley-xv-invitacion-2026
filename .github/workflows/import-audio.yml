name: Copy invitation music into the published site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the music previously provided for the invitation
        run: |
          mkdir -p assets
          curl --fail --location --retry 4 --retry-delay 3 --output assets/moonlight.m4a "https://invitacion-ashley-production.up.railway.app/media/moonlight.m4a"
          test "$(wc -c < assets/moonlight.m4a)" -gt 1000000
      - name: Save the music on the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/moonlight.m4a
          if ! git diff --cached --quiet; then
            git commit -m "Store the invitation music for independent hosting"
            git push
          fi
